<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKKO1062 PORTAL | KEMASKINI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e3a8a); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .input-glass { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 10px; border-radius: 8px; outline: none; width: 100%; transition: border-color 0.3s;}
        .input-glass:focus { border-color: #06b6d4; }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="glass max-w-6xl mx-auto p-4 mb-8 flex justify-between items-center">
        <h1 class="font-bold text-xl text-cyan-400">GKKO1062 PORTAL</h1>
        <button id="btnHome" class="bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20 transition"><i class="fa-solid fa-home"></i> Utama</button>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div id="viewHome" class="grid md:grid-cols-2 gap-8 py-20">
            <div id="goStudent" class="glass p-12 text-center cursor-pointer hover:scale-105 transition border-t-4 border-cyan-500">
                <i class="fa-solid fa-user-edit text-6xl mb-4 text-cyan-400"></i><h2 class="text-2xl font-bold">Portal Pelajar</h2><p class="text-white/50">Biodata & Foto</p>
            </div>
            <div id="goLecturer" class="glass p-12 text-center cursor-pointer hover:scale-105 transition border-t-4 border-emerald-500">
                <i class="fa-solid fa-users-cog text-6xl mb-4 text-emerald-400"></i><h2 class="text-2xl font-bold">Dashboard Pensyarah</h2><p class="text-white/50">Pemarkahan & Rumusan Kelas</p>
            </div>
        </div>

        <div id="viewStudentLogin" class="hidden-view glass max-w-md mx-auto p-10 text-center">
            <h2 class="text-xl font-bold mb-6 text-cyan-400">Log Masuk Pelajar (No. KP)</h2>
            <input type="text" id="kpLogin" placeholder="Guna No KP tanpa -" class="input-glass text-center font-bold mb-6">
            <button id="btnLoginStu" class="w-full bg-cyan-600 py-4 rounded-xl font-bold hover:bg-cyan-500 transition">Masuk Dashboard</button>
        </div>

        <div id="viewStudentDash" class="hidden-view glass p-8">
            <div class="flex flex-col md:flex-row gap-10">
                <div class="md:w-1/3 text-center flex flex-col items-center">
                    <div class="relative w-48 h-48 rounded-full border-4 border-cyan-500 mb-4 bg-gray-800 flex items-center justify-center overflow-hidden">
                        <i id="imgIcon" class="fa-solid fa-user text-6xl text-white/20"></i>
                        <img id="stuImg" class="hidden absolute inset-0 w-full h-full object-cover z-10">
                    </div>
                    <input type="file" id="fileImg" class="hidden" accept="image/jpeg, image/png">
                    <button onclick="document.getElementById('fileImg').click()" class="bg-cyan-600 hover:bg-cyan-500 transition px-6 py-2 rounded-xl font-bold w-full">Pilih Foto Profil Baru</button>
                    <p id="fileStatus" class="text-xs text-emerald-400 font-bold mt-2"></p>
                </div>
                <div class="md:w-2/3 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2"><label class="text-[10px] text-cyan-400 font-bold">NAMA PENUH</label><input type="text" id="b_nama" class="input-glass uppercase font-bold"></div>
                    <div><label class="text-[10px] text-cyan-400 font-bold">NO. KP</label><input type="text" id="b_kp" class="input-glass bg-white/5 text-white/50" readonly></div>
                    <div><label class="text-[10px] text-cyan-400 font-bold">ID SISTEM</label><input type="text" id="b_id" class="input-glass bg-white/5 text-white/50" readonly></div>
                    <div><label class="text-[10px] text-cyan-400 font-bold">JANTINA</label><select id="b_jantina" class="input-glass"><option value="LELAKI">LELAKI</option><option value="PEREMPUAN">PEREMPUAN</option></select></div>
                    <div><label class="text-[10px] text-cyan-400 font-bold">NO. GILIRAN</label><input type="text" id="b_giliran" class="input-glass"></div>
                    <div><label class="text-[10px] text-cyan-400 font-bold">KELAS</label><input type="text" id="b_kelas" class="input-glass"></div>
                    <div class="md:col-span-2"><label class="text-[10px] text-cyan-400 font-bold">PENSYARAH PENILAI</label><input type="text" id="b_penilai" class="input-glass"></div>
                </div>
            </div>
            <button id="btnUpdateStu" class="w-full bg-cyan-600 hover:bg-cyan-500 transition mt-10 py-5 rounded-xl font-bold text-lg shadow-lg shadow-cyan-500/30">SIMPAN SEMUA PERUBAHAN</button>
        </div>

        <div id="viewLecturerLogin" class="hidden-view glass max-w-md mx-auto p-10 text-center">
            <h2 class="text-xl font-bold mb-6 text-emerald-400">Log Masuk Pensyarah</h2>
            <input type="text" id="lUser" placeholder="ID Pengguna" class="input-glass mb-4">
            <input type="password" id="lPass" placeholder="Kata Laluan" class="input-glass mb-6">
            <button id="btnLoginLect" class="w-full bg-emerald-600 hover:bg-emerald-500 transition py-4 rounded-xl font-bold">Log Masuk</button>
        </div>

        <div id="viewLecturerDash" class="hidden-view space-y-6">
            <div class="glass p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-xl font-bold text-emerald-400">Pilih Kelas :</h2>
                <select id="selectClass" class="input-glass w-full md:w-64 font-bold text-emerald-400">
                    <option value="">-- Senarai Kelas --</option>
                </select>
            </div>
            <div id="classContent" class="hidden-view space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="summaryStats"></div>
                <div class="glass overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-left">
                    <thead class="bg-white/5 text-[10px] text-white/50">
                        <tr><th class="p-4">Pelajar</th><th class="text-center p-4">Markah (30/20/50)</th><th class="text-center w-20 p-4">Total</th><th class="text-center w-20 p-4">Gred</th><th class="text-center w-20 p-4">Simpan</th></tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table></div></div>
            </div>
        </div>
    </main>

    <div id="loader" class="hidden-view fixed inset-0 bg-black/80 flex items-center justify-center z-50 flex-col">
        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loaderText" class="font-bold uppercase tracking-widest text-sm text-cyan-300">Memproses...</p>
    </div>

    <script>
        // URL API ANDA YANG BAHARU
        const API = 'https://script.google.com/macros/s/AKfycbwMBTWvGlSLiRbt08szbvacoJiDpRTRoGgJTAgfrysJJXqteLEs_d3QVHi5t2Fqtyi3/exec';

        // Fix 1 & 2: Pengurusan Gambar Google Drive
        function fixDriveUrl(url) {
            if (!url) return "";
            const match = url.match(/[-\w]{25,}/);
            return match ? `https://drive.google.com/thumbnail?id=${match[0]}&sz=w800` : url;
        }

        function loadImage(imgId, iconId, rawUrl) {
            const img = document.getElementById(imgId);
            const icon = document.getElementById(iconId);
            const finalUrl = fixDriveUrl(rawUrl);
            if (!finalUrl) { img.classList.add('hidden'); if(icon) icon.classList.remove('hidden'); return; }
            img.onload = () => { img.classList.remove('hidden'); if(icon) icon.classList.add('hidden'); };
            img.onerror = () => { img.classList.add('hidden'); if(icon) icon.classList.remove('hidden'); };
            img.src = finalUrl;
        }

        function setLoader(show, text="Memproses...") {
            const loaderText = document.getElementById('loaderText');
            const loader = document.getElementById('loader');
            if (loaderText) loaderText.innerText = text;
            if (loader) {
                if(show) loader.classList.remove('hidden-view');
                else loader.classList.add('hidden-view');
            }
        }

        async function call(payload) {
            try {
                const res = await fetch(API, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain' }, 
                    body: JSON.stringify(payload) 
                });
                const txt = await res.text();
                try { 
                    return JSON.parse(txt); 
                } catch(e) { 
                    alert("Ralat Server. Pastikan deployment Who has access adalah 'Anyone'."); 
                    console.error(txt);
                    return {success:false}; 
                }
            } catch(e) { 
                alert("Ralat Rangkaian / Internet."); 
                return {success:false}; 
            }
        }

        // NAVIGATION
        document.getElementById('btnHome').onclick = () => location.reload();
        document.getElementById('goStudent').onclick = () => showView('viewStudentLogin');
        document.getElementById('goLecturer').onclick = () => showView('viewLecturerLogin');

        function showView(v) {
            ['viewHome','viewStudentLogin','viewStudentDash','viewLecturerDash','viewLecturerLogin'].forEach(i => {
                const el = document.getElementById(i);
                if(el) el.classList.add('hidden-view');
            });
            document.getElementById(v).classList.remove('hidden-view');
            window.scrollTo(0, 0);
        }

        // ==========================================
        // PORTAL PELAJAR
        // ==========================================
        document.getElementById('fileImg').addEventListener('change', function(e) {
            const st = document.getElementById('fileStatus');
            if(this.files[0] && st) st.innerText = "✓ Gambar sedia dimuat naik. Klik SIMPAN.";
            else if(st) st.innerText = "";
        });

        document.getElementById('btnLoginStu').onclick = async () => {
            const kp = document.getElementById('kpLogin').value.trim();
            if(!kp) return alert("Sila masukkan No KP.");
            
            setLoader(true, "MENCARI DATA...");
            const res = await call({ action: "getStudentByKP", noKP: kp });
            setLoader(false);

            if(res.success) {
                const s = res.student;
                document.getElementById('b_kp').value = s.nokp || "";
                document.getElementById('b_id').value = s.id || "";
                document.getElementById('b_nama').value = s.nama || "";
                document.getElementById('b_jantina').value = s.jantina || "LELAKI";
                document.getElementById('b_giliran').value = s.nogiliran || "";
                document.getElementById('b_kelas').value = s.kelas || "";
                document.getElementById('b_penilai').value = s.penilai || "";
                
                document.getElementById('fileImg').value = "";
                const fs = document.getElementById('fileStatus');
                if(fs) fs.innerText = "";
                
                loadImage('stuImg', 'imgIcon', s.gambar);
                showView('viewStudentDash');
            } else {
                alert(res.message || "Rekod tidak ditemui!");
            }
        };

        // Fix 3: Upload tanpa Reload
        document.getElementById('btnUpdateStu').onclick = async () => {
            const kp = document.getElementById('b_kp').value;
            const file = document.getElementById('fileImg').files[0];
            
            if(file) {
                setLoader(true, "MEMUAT NAIK GAMBAR...");
                const base64 = await new Promise(r => { 
                    const reader = new FileReader(); 
                    reader.onload = (e) => r(e.target.result); 
                    reader.readAsDataURL(file); 
                });
                
                const resUp = await call({ action: "uploadFoto", noKP: kp, imageBlob: base64 });
                if(resUp.success) {
                    setLoader(true, "MEMPROSES PAUTAN...");
                    await new Promise(r => setTimeout(r, 2000)); // Drive API delay
                } else {
                    setLoader(false);
                    return alert("Ralat Gambar: " + (resUp.message || "Gagal muat naik"));
                }
            }

            setLoader(true, "MENYIMPAN BIODATA...");
            const resBio = await call({ 
                action: "updateBiodata", 
                formData: { 
                    No_KP: kp, 
                    Nama_Pelajar: document.getElementById('b_nama').value, 
                    JANTINA: document.getElementById('b_jantina').value, 
                    No_Giliran: document.getElementById('b_giliran').value, 
                    Kelas: document.getElementById('b_kelas').value, 
                    Penilai: document.getElementById('b_penilai').value 
                }
            });

            setLoader(false);

            if(resBio.success) {
                if(file) {
                    setLoader(true, "MENYEGARKAN GAMBAR...");
                    const resFresh = await call({ action: "getStudentByKP", noKP: kp });
                    setLoader(false);
                    if(resFresh.success) loadImage('stuImg', 'imgIcon', resFresh.student.gambar);
                }
                const fs = document.getElementById('fileStatus');
                if(fs) fs.innerText = "";
                alert("Berjaya Disimpan ke Pangkalan Data!");
            } else {
                alert("Ralat menyalin biodata: " + resBio.message);
            }
        };

        // ==========================================
        // DASHBOARD PENSYARAH
        // ==========================================
        document.getElementById('btnLoginLect').onclick = async () => {
            setLoader(true, "MENGESAHKAN...");
            const res = await call({ action: "login", username: document.getElementById('lUser').value, password: document.getElementById('lPass').value });
            if(res.success) {
                const resClass = await call({ action: "getClasses" });
                setLoader(false);
                if(resClass.success) {
                    const sel = document.getElementById('selectClass');
                    sel.innerHTML = '<option value="">-- Senarai Kelas --</option>';
                    resClass.classes.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
                    showView('viewLecturerDash');
                }
            } else {
                setLoader(false);
                alert(res.message || "Log masuk gagal.");
            }
        };

        document.getElementById('selectClass').onchange = async (e) => {
            if(!e.target.value) return;
            setLoader(true, "MENARIK SENARAI KELAS...");
            const res = await call({ action: "getStudentsByClass", kelas: e.target.value });
            setLoader(false);
            if(res.success) renderTable(res.students);
        };

        function renderTable(students) {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            students.forEach((s, i) => {
                const imgId = 'tImg'+i;
                const iconId = 'tIcn'+i;
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition">
                        <td class="p-4 flex items-center gap-3">
                            <div class="relative w-10 h-10 rounded-full border border-white/20 bg-gray-800 flex items-center justify-center overflow-hidden">
                                <i id="${iconId}" class="fa-solid fa-user text-white/30 text-xs"></i>
                                <img id="${imgId}" class="hidden absolute inset-0 w-full h-full object-cover z-10">
                            </div>
                            <span class="text-[11px] font-bold uppercase truncate w-32 md:w-full">${s.nama}</span>
                        </td>
                        <td class="text-center p-2">
                            <input type="number" value="${s.u}" oninput="calc(${i})" class="input-glass w-12 text-center u-in text-[10px] p-2">
                            <input type="number" value="${s.p}" oninput="calc(${i})" class="input-glass w-12 text-center p-in text-[10px] p-2">
                            <input type="number" value="${s.pen}" oninput="calc(${i})" class="input-glass w-12 text-center pen-in text-[10px] p-2">
                        </td>
                        <td class="text-center font-bold text-cyan-400 t-out p-2">${s.total}</td>
                        <td class="text-center font-bold g-out p-2">${s.gred}</td>
                        <td class="text-center p-2"><button onclick="saveMark('${s.id}', ${i})" class="bg-emerald-600 hover:bg-emerald-500 transition p-2 rounded-lg text-[10px] text-white w-full"><i class="fa-solid fa-save"></i></button></td>
                    </tr>`;
                setTimeout(() => loadImage(imgId, iconId, s.gambar), 50);
            });
            updateStats();
            document.getElementById('classContent').classList.remove('hidden-view');
        }

        function calc(idx) {
            const u = parseFloat(document.querySelectorAll('.u-in')[idx].value) || 0;
            const p = parseFloat(document.querySelectorAll('.p-in')[idx].value) || 0;
            const pen = parseFloat(document.querySelectorAll('.pen-in')[idx].value) || 0;
            const t = u + p + pen;
            document.querySelectorAll('.t-out')[idx].innerText = t.toFixed(1);
            document.querySelectorAll('.g-out')[idx].innerText = t>=90?"A+":t>=80?"A":t>=75?"A-":t>=70?"B+":t>=65?"B":t>=60?"B-":t>=55?"C+":t>=50?"C":t>=40?"D":"F";
            updateStats();
        }

        function updateStats() {
            const totals = Array.from(document.querySelectorAll('.t-out')).map(e => parseFloat(e.innerText));
            const greds = Array.from(document.querySelectorAll('.g-out')).map(e => e.innerText);
            const avg = totals.length ? (totals.reduce((a,b)=>a+b,0)/totals.length).toFixed(1) : 0;
            const a = greds.filter(g => g.startsWith('A')).length;
            const lulus = greds.filter(g => g !== 'F' && g !== '').length;
            document.getElementById('summaryStats').innerHTML = `
                <div class="glass p-4 text-center"><p class="text-[10px] opacity-50">PURATA KELAS</p><p class="text-2xl font-bold">${avg}</p></div>
                <div class="glass p-4 text-center border-b-4 border-emerald-500"><p class="text-[10px] opacity-50 text-emerald-400">BIL. A</p><p class="text-2xl font-bold">${a}</p></div>
                <div class="glass p-4 text-center border-b-4 border-cyan-500"><p class="text-[10px] opacity-50 text-cyan-400">LULUS</p><p class="text-2xl font-bold">${lulus}</p></div>
                <div class="glass p-4 text-center border-b-4 border-red-500"><p class="text-[10px] opacity-50 text-red-400">GAGAL</p><p class="text-2xl font-bold">${totals.length - lulus}</p></div>
            `;
        }

        async function saveMark(id, idx) {
            const u = document.querySelectorAll('.u-in')[idx].value;
            const p = document.querySelectorAll('.p-in')[idx].value;
            const pen = document.querySelectorAll('.pen-in')[idx].value;
            setLoader(true, "MENYIMPAN MARKAH...");
            const res = await call({ action:"saveMarks", idSistem:id, u, p, pen });
            setLoader(false);
            if(res.success) alert("Markah Berjaya Disimpan!");
            else alert(res.message || "Gagal menyimpan markah.");
        }
    </script>
</body>
</html>
