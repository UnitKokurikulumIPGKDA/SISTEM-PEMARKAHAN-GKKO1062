<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKKO1062 - Sistem Markah Tugasan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 42px;
            font-weight: 700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Student View */
        .search-box {
            display: flex;
            gap: 12px;
            align-items: end;
        }

        .search-box input {
            flex: 1;
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .biodata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .biodata-card {
            background: rgba(255,255,255,0.9);
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .biodata-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-graduation-cap"></i> GKKO1062</h1>
            <p>Sistem Penilaian Tugasan Kokurikulum dan Kesihatan Diri</p>
        </header>

        <!-- LOGIN VIEW -->
        <div id="loginView" class="view-container active glass" style="max-width: 420px; margin: 60px auto; padding: 50px 40px;">
            <div style="text-align:center; margin-bottom:30px;">
                <i class="fas fa-lock fa-4x" style="color:var(--primary); opacity:0.8;"></i>
            </div>
            <h2 style="text-align:center; color:var(--dark);">Login Pensyarah</h2>
            <div id="loginAlert"></div>
            <input type="text" id="username" class="glass" style="width:100%; padding:16px; margin:12px 0; border-radius:16px; border:none;" placeholder="Username">
            <input type="password" id="password" class="glass" style="width:100%; padding:16px; margin:12px 0; border-radius:16px; border:none;" placeholder="Password">
            <button class="btn btn-primary" onclick="loginLecturer()" style="width:100%; padding:16px; font-size:16px;">
                <i class="fas fa-sign-in-alt"></i> MASUK
            </button>
        </div>

        <!-- STUDENT VIEW -->
        <div id="studentView" class="view-container glass" style="display:none;">
            <div class="glass" style="padding:20px 30px; display:flex; justify-content:space-between; align-items:center; border-radius:24px 24px 0 0;">
                <h2><i class="fas fa-user-graduate"></i> Dashboard Pelajar</h2>
                <button class="btn btn-danger" onclick="logout()">Keluar</button>
            </div>

            <div style="padding:40px;">
                <div class="section">
                    <h3 style="margin-bottom:15px;"><i class="fas fa-search"></i> Cari Maklumat Pelajar</h3>
                    <div class="search-box">
                        <input type="text" id="studentSearch" placeholder="Masukkan No. Kad Pengenalan (No. KP)" maxlength="12">
                        <button class="btn btn-primary" onclick="loadStudentData()" style="padding:0 32px;">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div id="biodataSection" style="display:none;">
                    <div class="biodata-grid" id="biodataGrid"></div>

                    <!-- Image Upload -->
                    <div style="margin-top:40px;">
                        <h3><i class="fas fa-camera"></i> Muat Naik Gambar Pelajar</h3>
                        <div id="uploadArea" style="border:2px dashed var(--primary); border-radius:20px; padding:50px; text-align:center; cursor:pointer;">
                            <i class="fas fa-cloud-upload-alt fa-4x" style="color:var(--primary); margin-bottom:15px;"></i>
                            <p>Klik atau seret gambar ke sini</p>
                            <small>JPG / PNG • Maks 5MB</small>
                            <input type="file" id="fileInput" accept="image/*" style="display:none;">
                        </div>
                        <div id="uploadStatus" style="margin-top:15px;"></div>
                        <div id="imagePreview" style="margin-top:20px; text-align:center;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LECTURER VIEW (sama seperti sebelumnya, saya ringkaskan) -->
        <!-- ... (Lecturer View kekal sama seperti versi sebelum ini) ... -->
    </div>

    <!-- TOAST -->
    <div id="toast"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwMBTWvGlSLiRbt08szbvacoJiDpRTRoGgJTAgfrysJJXqteLEs_d3QVHi5t2Fqtyi3/exec';

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toastText');
            text.innerHTML = message;
            toast.style.display = 'flex';
            toast.style.background = type === 'success' ? '#10b981' : '#ef4444';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Student Search menggunakan No. KP
        function loadStudentData() {
            const noKP = document.getElementById('studentSearch').value.trim();
            if (!noKP) return showToast('Sila masukkan No. Kad Pengenalan', 'error');

            fetch(`${API_URL}?action=getStudent&noKP=${noKP}`)
                .then(r => r.json())
                .then(student => {
                    if (student && student.No_KP) {
                        displayStudentBiodata(student);
                        document.getElementById('biodataSection').style.display = 'block';
                        showToast('Maklumat pelajar berjaya dimuat!');
                    } else {
                        showToast('Pelajar tidak dijumpai', 'error');
                    }
                })
                .catch(() => showToast('Ralat sambungan', 'error'));
        }

        function displayStudentBiodata(student) {
            const grid = document.getElementById('biodataGrid');
            grid.innerHTML = '';

            const data = [
                {icon: 'fa-barcode', label: 'ID Sistem', value: student.ID_SISTEM},
                {icon: 'fa-user', label: 'Nama Pelajar', value: student.Nama_Pelajar},
                {icon: 'fa-id-card', label: 'No. Kad Pengenalan', value: student.No_KP},
                {icon: 'fa-hashtag', label: 'No. Giliran', value: student.No_Giliran},
                {icon: 'fa-venus-mars', label: 'Jantina', value: student.JANTINA},
                {icon: 'fa-chalkboard', label: 'Kelas', value: student.Kelas},
                {icon: 'fa-chalkboard-user', label: 'Penilai', value: student.Penilai}
            ];

            data.forEach(item => {
                grid.innerHTML += `
                    <div class="biodata-card glass">
                        <i class="fas ${item.icon}" style="font-size:32px; color:var(--primary); margin-bottom:12px;"></i>
                        <div style="color:#64748b; font-size:13px;">${item.label}</div>
                        <div style="font-weight:600; font-size:17px; margin-top:4px;">${item.value || '-'}</div>
                    </div>
                `;
            });

            if (student.Link_Gambar) {
                document.getElementById('imagePreview').innerHTML = `<img src="${student.Link_Gambar}" style="max-width:320px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2);">`;
            }
        }

        // Image Upload (kekal sama)
        document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('fileInput').click());
        // ... (kod handleImageUpload kekal seperti sebelum ini)

        function logout() {
            location.reload();
        }

        // Lecturer functions (sama seperti versi lama)
        // Anda boleh copy dari versi sebelum ini
    </script>
</body>
</html>
