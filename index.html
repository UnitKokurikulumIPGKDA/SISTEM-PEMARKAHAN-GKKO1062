<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem GKKO1062 - Biodata & Markah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .hidden-view { display: none !important; }
        .input-glass {
            background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 14px; border-radius: 12px; width: 100%; outline: none; transition: 0.3s;
        }
        .input-glass:focus { border-color: #06b6d4; box-shadow: 0 0 10px rgba(6,182,212,0.3); }
        .btn-hover { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .btn-hover:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="glass max-w-5xl mx-auto p-4 mb-8 flex justify-between items-center">
        <h1 class="font-bold text-xl md:text-2xl text-cyan-400 tracking-wider"><i class="fa-solid fa-graduation-cap mr-2"></i>GKKO1062</h1>
        <button id="btnHome" class="bg-white/10 px-5 py-2 rounded-lg hover:bg-white/20 transition font-semibold cursor-pointer"><i class="fa-solid fa-house mr-1"></i> Utama</button>
    </nav>

    <main class="max-w-5xl mx-auto relative z-10">
        
        <div id="viewHome" class="grid md:grid-cols-2 gap-8 py-10">
            <div id="goStudent" class="glass p-12 text-center btn-hover border-t-4 border-cyan-500">
                <i class="fa-solid fa-user-pen text-6xl mb-6 text-cyan-400"></i>
                <h2 class="text-3xl font-bold mb-2">Portal Pelajar</h2>
                <p class="text-white/60">Kemaskini Biodata & Foto Profil</p>
            </div>
            <div id="goLecturer" class="glass p-12 text-center btn-hover border-t-4 border-emerald-500">
                <i class="fa-solid fa-user-shield text-6xl mb-6 text-emerald-400"></i>
                <h2 class="text-3xl font-bold mb-2">Portal Pensyarah</h2>
                <p class="text-white/60">Sistem Pemarkahan Tugasan</p>
            </div>
        </div>

        <div id="viewStudentLogin" class="hidden-view glass max-w-md mx-auto p-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-cyan-400"><i class="fa-solid fa-right-to-bracket mr-2"></i>Akses Pelajar</h2>
            <div class="mb-6">
                <label class="block text-sm text-white/60 mb-2 ml-1">Masukkan ID Sistem</label>
                <input type="text" id="stuIdLogin" placeholder="Contoh: MPU2082_002" class="input-glass font-bold text-lg">
            </div>
            <button id="btnLoginStu" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 py-4 rounded-xl font-bold text-lg btn-hover shadow-lg">Log Masuk</button>
        </div>

        <div id="viewLecturerLogin" class="hidden-view glass max-w-md mx-auto p-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-emerald-400"><i class="fa-solid fa-lock mr-2"></i>Log Masuk Staf</h2>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm text-white/60 mb-2 ml-1">ID Pengguna</label>
                    <input type="text" id="lectUsername" class="input-glass">
                </div>
                <div>
                    <label class="block text-sm text-white/60 mb-2 ml-1">Kata Laluan</label>
                    <input type="password" id="lectPassword" class="input-glass">
                </div>
            </div>
            <button id="btnLoginLect" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 py-4 rounded-xl font-bold text-lg btn-hover shadow-lg">Log Masuk</button>
        </div>

        <div id="viewStudentDash" class="hidden-view glass p-8">
            <h2 class="text-2xl font-bold border-b border-white/10 pb-4 mb-6 text-cyan-300">Profil Pelajar</h2>
            <div class="flex flex-col md:flex-row gap-10">
                <div class="md:w-1/3 text-center md:border-r border-white/10 md:pr-8">
                    <div class="relative w-48 h-48 mx-auto mb-4">
                        <img id="stuImg" src="https://ui-avatars.com/api/?name=User&background=random&color=fff" class="w-full h-full rounded-full object-cover border-4 border-cyan-500 shadow-xl bg-white/10">
                    </div>
                    <input type="file" id="fileImg" class="hidden" accept="image/jpeg, image/png">
                    <button id="btnTriggerUpload" class="bg-cyan-600/80 hover:bg-cyan-500 px-6 py-3 rounded-xl font-bold transition w-full mb-2 cursor-pointer border border-cyan-400/50"><i class="fa-solid fa-camera mr-2"></i>Tukar Foto</button>
                    <p class="text-xs text-white/40">Klik Simpan di bawah selepas memuat naik foto.</p>
                </div>

                <div class="md:w-2/3 grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div><label class="text-xs font-bold text-cyan-300 uppercase">ID Sistem</label><input type="text" id="b_id" class="input-glass bg-black/40 text-white/50" readonly></div>
                    <div><label class="text-xs font-bold text-cyan-300 uppercase">Nama Pelajar</label><input type="text" id="b_nama" class="input-glass font-bold"></div>
                    <div><label class="text-xs font-bold text-cyan-300 uppercase">Jantina</label>
                        <select id="b_jantina" class="input-glass font-bold bg-gray-800">
                            <option value="LELAKI">LELAKI</option><option value="PEREMPUAN">PEREMPUAN</option>
                        </select>
                    </div>
                    <div><label class="text-xs font-bold text-cyan-300 uppercase">No. KP</label><input type="text" id="b_kp" class="input-glass font-bold"></div>
                    <div><label class="text-xs font-bold text-cyan-300 uppercase">No. Giliran</label><input type="text" id="b_giliran" class="input-glass font-bold"></div>
                    <div><label class="text-xs font-bold text-cyan-300 uppercase">Kelas</label><input type="text" id="b_kelas" class="input-glass font-bold"></div>
                    <div class="md:col-span-2"><label class="text-xs font-bold text-cyan-300 uppercase">Pensyarah Penilai</label><input type="text" id="b_penilai" class="input-glass font-bold"></div>
                </div>
            </div>
            <button id="btnUpdateStu" class="w-full bg-cyan-600 hover:bg-cyan-500 mt-10 py-5 rounded-2xl font-extrabold text-lg tracking-widest uppercase transition shadow-[0_0_20px_rgba(6,182,212,0.4)] cursor-pointer">
                Simpan & Kemaskini Profil <i class="fa-solid fa-cloud-arrow-up ml-2"></i>
            </button>
        </div>

        <div id="viewLecturerDash" class="hidden-view glass p-8">
            <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-emerald-400">Dashboard Pensyarah</h2>
                    <p class="text-sm text-white/60">Selamat datang, <span id="displayLectName" class="font-bold text-white"></span></p>
                </div>
            </div>

            <div class="bg-black/20 p-6 rounded-2xl border border-white/5 mb-8">
                <h3 class="text-sm font-bold text-emerald-300 uppercase mb-3">Cari Pelajar Untuk Dinilai</h3>
                <div class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="searchId" placeholder="Masukkan ID Sistem Pelajar..." class="input-glass flex-1 font-bold">
                    <button id="btnSearch" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-xl font-bold cursor-pointer transition">Cari Pelajar</button>
                </div>
            </div>

            <div id="markForm" class="hidden-view glass p-8 border-t-4 border-emerald-500 bg-white/5">
                <h3 class="text-xl font-bold text-white mb-6" id="displayStudentTarget">NAMA PELAJAR</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div><label class="text-xs font-bold text-emerald-300 uppercase">Ujian (Max 30)</label><input type="number" id="m_ujian" class="input-glass font-bold text-xl text-center"></div>
                    <div><label class="text-xs font-bold text-emerald-300 uppercase">Persembahan (Max 20)</label><input type="number" id="m_per" class="input-glass font-bold text-xl text-center"></div>
                    <div><label class="text-xs font-bold text-emerald-300 uppercase">Penulisan (Max 50)</label><input type="number" id="m_pen" class="input-glass font-bold text-xl text-center"></div>
                </div>
                <button id="btnSaveMark" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl font-extrabold text-lg tracking-widest uppercase transition shadow-[0_0_20px_rgba(16,185,129,0.4)] cursor-pointer">
                    Simpan Markah <i class="fa-solid fa-check-circle ml-2"></i>
                </button>
            </div>
        </div>

    </main>

    <div id="loader" class="hidden-view fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 flex-col">
        <div class="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-cyan-300 font-bold tracking-widest animate-pulse" id="loaderText">MEMPROSES...</p>
    </div>

    <script>
        // API URL TETAP
        const API = 'https://script.google.com/macros/s/AKfycbz5UpIYcxsswWo7H3P3EWdpLrsIqTEJ7zMJiu0H70F0ecvOQ7h7MBSB6g0xWrguiyJk/exec';

        window.onload = function() {
            console.log("Sistem Sedia.");

            function showView(viewId) {
                const views = ['viewHome', 'viewStudentLogin', 'viewLecturerLogin', 'viewStudentDash', 'viewLecturerDash'];
                views.forEach(v => {
                    let el = document.getElementById(v);
                    if(el) el.classList.add('hidden-view');
                });
                document.getElementById(viewId).classList.remove('hidden-view');
                window.scrollTo(0, 0);
            }

            function toggleLoader(show, text="MEMPROSES...") {
                let el = document.getElementById('loader');
                if(show) {
                    document.getElementById('loaderText').innerText = text;
                    el.classList.remove('hidden-view');
                } else {
                    el.classList.add('hidden-view');
                }
            }

            async function call(payload) {
                try {
                    const res = await fetch(API, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload) 
                    });
                    return await res.json();
                } catch(e) { 
                    alert("Gagal menghubungi pangkalan data. Pastikan internet stabil.");
                    return { success: false };
                }
            }

            document.getElementById('btnHome').addEventListener('click', () => showView('viewHome'));
            document.getElementById('goStudent').addEventListener('click', () => showView('viewStudentLogin'));
            document.getElementById('goLecturer').addEventListener('click', () => showView('viewLecturerLogin'));

            // === LOGIN PELAJAR ===
            document.getElementById('btnLoginStu').addEventListener('click', async () => {
                const id = document.getElementById('stuIdLogin').value.trim();
                if(!id) return alert("Sila masukkan ID Sistem anda.");

                toggleLoader(true, "MENCARI DATA...");
                const res = await call({ action: "getStudent", idSistem: id });
                toggleLoader(false);

                if(res.success && res.student) {
                    const s = res.student;
                    document.getElementById('b_id').value = s.id || "";
                    document.getElementById('b_nama').value = s.nama || "";
                    document.getElementById('b_jantina').value = s.jantina || "LELAKI";
                    document.getElementById('b_kp').value = s.nokp || "";
                    document.getElementById('b_giliran').value = s.nogiliran || "";
                    document.getElementById('b_kelas').value = s.kelas || "";
                    document.getElementById('b_penilai').value = s.penilai || "";
                    document.getElementById('stuImg').src = (s.gambar && s.gambar !== "") ? s.gambar : "https://ui-avatars.com/api/?name=User&background=random&color=fff";
                    
                    showView('viewStudentDash');
                } else {
                    alert(res.message);
                }
            });

            // === UPLOAD GAMBAR ===
            document.getElementById('btnTriggerUpload').addEventListener('click', () => {
                document.getElementById('fileImg').click();
            });

            // === UPDATE BIODATA PELAJAR ===
            document.getElementById('btnUpdateStu').addEventListener('click', async () => {
                const id = document.getElementById('b_id').value;
                if(!id) return;

                const formData = {
                    ID_SISTEM: id,
                    Nama_Pelajar: document.getElementById('b_nama').value,
                    JANTINA: document.getElementById('b_jantina').value,
                    No_KP: document.getElementById('b_kp').value,
                    No_Giliran: document.getElementById('b_giliran').value,
                    Kelas: document.getElementById('b_kelas').value,
                    Penilai: document.getElementById('b_penilai').value
                };
                
                toggleLoader(true, "MENYIMPAN PROFIL...");

                const fileInput = document.getElementById('fileImg');
                const file = fileInput.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        await call({ 
                            action: "uploadFoto", 
                            idSistem: id, 
                            imageBlob: e.target.result, 
                            fileName: file.name 
                        });
                        saveTextData(formData);
                    };
                    reader.readAsDataURL(file);
                } else {
                    saveTextData(formData);
                }
            });

            async function saveTextData(formData) {
                const res = await call({ action: "updateBiodata", formData: formData });
                toggleLoader(false);
                if(res.success) alert("Profil anda berjaya dikemaskini dalam pangkalan data!");
                else alert("Gagal mengemaskini profil.");
            }

            // === LOGIN PENSYARAH ===
            document.getElementById('btnLoginLect').addEventListener('click', async () => {
                const u = document.getElementById('lectUsername').value.trim();
                const p = document.getElementById('lectPassword').value.trim();
                if(!u || !p) return alert("Sila masukkan Username & Kata Laluan.");

                toggleLoader(true, "MENGESAHKAN...");
                const res = await call({ action: "login", username: u, password: p });
                toggleLoader(false);

                if(res.success) {
                    document.getElementById('displayLectName').innerText = res.lecturerName;
                    showView('viewLecturerDash');
                } else {
                    alert(res.message);
                }
            });

            // === PENSYARAH: CARI PELAJAR ===
            document.getElementById('btnSearch').addEventListener('click', async () => {
                const id = document.getElementById('searchId').value.trim();
                if(!id) return alert("Sila isikan ID Pelajar.");

                toggleLoader(true, "MENCARI...");
                const res = await call({ action: "getStudent", idSistem: id });
                toggleLoader(false);

                if(res.success && res.student) {
                    document.getElementById('displayStudentTarget').innerText = res.student.nama + " (" + res.student.id + ")";
                    document.getElementById('m_ujian').value = "";
                    document.getElementById('m_per').value = "";
                    document.getElementById('m_pen').value = "";
                    document.getElementById('markForm').classList.remove('hidden-view');
                } else {
                    alert(res.message);
                    document.getElementById('markForm').classList.add('hidden-view');
                }
            });

            // === PENSYARAH: SIMPAN MARKAH ===
            document.getElementById('btnSaveMark').addEventListener('click', async () => {
                const id = document.getElementById('searchId').value.trim();
                const u = document.getElementById('m_ujian').value;
                const per = document.getElementById('m_per').value;
                const pen = document.getElementById('m_pen').value;

                toggleLoader(true, "MENYIMPAN MARKAH...");
                const res = await call({
                    action: "saveMarks", 
                    idSistem: id,
                    ujian: u, persembahan: per, penulisan: pen
                });
                toggleLoader(false);

                if(res.success) {
                    alert("Berjaya! Markah penuh: " + res.total + " | Gred: " + res.gred);
                    document.getElementById('markForm').classList.add('hidden-view');
                    document.getElementById('searchId').value = "";
                } else {
                    alert("Ralat sewaktu menyimpan markah: " + res.message);
                }
            });
        };
    </script>
</body>
</html>
